name: bottrader-aws

services:
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - /opt/bot/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d ${DB_NAME} -h 127.0.0.1 -p ${DB_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 20

  v2-kraken:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.v2
    container_name: v2-kraken
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      TZ: ${TZ}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      V2_CONFIG: "/app/v2/kraken_paper_trading.yaml"
      DATABASE_URL: "postgresql://${DB_USER:-bot_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME}"
      AWS_REGION: ${AWS_REGION:-us-west-2}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/bot/.env:/app/.env:ro
      - /opt/bot/logs:/app/logs
    entrypoint: [ "/usr/bin/tini","--","/app/docker/entrypoint/entrypoint.v2.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import os,time,sys;p='/app/logs/v2_kraken/heartbeat';sys.exit(0) if (os.path.exists(p) and (time.time()-os.path.getmtime(p)<300)) else sys.exit(1)\"" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dashboard
    container_name: dashboard
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    environment:
      TZ: ${TZ}
      DATABASE_URL: "postgresql://${DB_USER:-bot_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME}"
      STARTING_CAPITAL: "10000"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - /opt/bot/.env:/app/.env:ro
      - /opt/bot/logs:/app/logs:ro
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  pg_data:
    external: true
    name: bottrader-aws_pg_data



