# BotTrader v2 — Paper Trading Configuration (Kraken)
# Usage: python -m v2 --config v2/kraken_paper_trading.yaml
#
# Paper trading uses live Kraken WebSocket data but simulates
# all order fills locally. No real money is used.
#
# Runs alongside Coinbase paper trader on AWS.
# Only pair_discovery, exchange fees, and data_providers differ
# from the Coinbase config — proving the exchange-agnostic architecture.

app:
  name: "BotTrader"
  mode: "paper"
  # Fallback symbols — used only if pair discovery fails at startup.
  symbols:
    - "BTC-USD"
    - "ETH-USD"
    - "SOL-USD"
    - "XRP-USD"
    - "DOGE-USD"
    - "ADA-USD"
    - "LINK-USD"
    - "DOT-USD"
    - "LTC-USD"

# Dynamic pair discovery — fetches pairs from Kraken public API
# and filters by 24h volume (same two-pass algorithm as Coinbase).
pair_discovery:
  type: "kraken"
  key_file: "/app/Config/kraken_api_info.json"
  config:
    refresh_interval_minutes: 30
    min_quote_volume: 500000
    shill_coins: ["TRUMP"]
    seed_symbols: ["BTC-USD", "ETH-USD"]
    max_pairs: 50

exchange:
  type: "paper"
  initial_balance_usd: 10000
  maker_fee: 0.0025    # Kraken base tier: 0.25% maker
  taker_fee: 0.004     # Kraken base tier: 0.40% taker
  slippage_bps: 1.0

data_providers:
  - type: "kraken_websocket"
    key_file: "/app/Config/kraken_api_info.json"
    channels: ["ticker"]
    idle_timeout: 90.0

# Strategy, risk, execution, storage, observers — identical to Coinbase config
strategies:
  - type: "composite_scoring"
    config:
      candle_interval_minutes: 5
      score_buy_target: 2.0
      score_sell_target: 2.0
      allow_buys_on_red_day: true
      bb_window: 10
      buy_ratio: 1.05
      macd_fast: 8
      macd_slow: 21
      macd_signal: 5
      rsi_buy: 25.0
      rsi_sell: 75.0
      roc_window: 4
      roc_buy_threshold: 2.0
      roc_sell_threshold: -1.0
      sma_volatility: 10
      atr_window: 8
      swing_window: 10
      volume_confirm_buy: true
      volume_confirm_threshold: 0.7
      volume_div_window: 10
      min_indicators_required: 3
      cooldown_bars: 2
      loss_lockout_bars: 12

risk:
  - type: "basic"
    pass_through: false
    hodl_symbols: []
  - type: "performance_filter"
    window_days: 30
    min_trades: 3
    min_win_rate: 0.30
    min_avg_pnl: -5.0
    min_total_pnl: -50.0
  - type: "exit_manager"
    hard_stop_pct: 0.045
    soft_stop_pct: 0.03
    trailing_activation_pct: 0.03
    trailing_distance_pct: 0.03
    check_interval_sec: 5
    signal_exit_enabled: true
    signal_exit_min_pnl_pct: 0.0
  - type: "circuit_breaker"
    max_losses_in_window: 5
    loss_window_minutes: 30
    large_loss_threshold_usd: 50
    max_consecutive_rejections: 10
    cooldown_minutes: 30

execution:
  type: "maker_only"
  max_retries: 3
  post_only: true
  default_notional: 50
  stale_timeout_seconds: 300
  cancel_drift_pct: 0.005

storage:
  type: "postgres"
  dsn_env: "DATABASE_URL"

observers:
  - type: "structured_log"
    level: "INFO"
  - type: "signal_comparison"
    log_path: "/app/logs/v2_kraken_score_log.jsonl"
  - type: "heartbeat"
    path: "/app/logs/v2_kraken/heartbeat"
    interval: 10.0
