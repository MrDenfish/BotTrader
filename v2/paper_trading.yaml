# BotTrader v2 — Paper Trading Configuration (Production Docker)
# Usage: python -m v2 --config v2/paper_trading.yaml
#
# Paper trading uses live Coinbase WebSocket data but simulates
# all order fills locally. No real money is used.
#
# Runs alongside v1 on AWS. Shares the same PostgreSQL instance
# (v2 uses v2_* prefixed tables) and logs volume.

app:
  name: "BotTrader"
  mode: "paper"
  # Fallback symbols — used only if pair discovery fails at startup.
  # When pair_discovery is active, this list is replaced by discovered pairs.
  symbols:
    - "BTC-USD"
    - "ETH-USD"
    - "SOL-USD"
    - "XRP-USD"
    - "DOGE-USD"
    - "ADA-USD"
    - "LINK-USD"
    - "HBAR-USD"
    - "SUI-USD"
    - "PEPE-USD"
    - "LTC-USD"
    - "BCH-USD"

# Dynamic pair discovery — fetches products from Coinbase API and
# filters by 24h volume (same algorithm as v1). Replaces app.symbols
# at startup and refreshes periodically.
pair_discovery:
  type: "coinbase"
  key_file: "/app/Config/websocket_api_info.json"
  config:
    refresh_interval_minutes: 30
    min_quote_volume: 1000000   # hard floor: skip coins with < $1M 24h volume
    shill_coins: ["UNFI", "TRUMP", "MATIC"]
    seed_symbols: ["BTC-USD", "ETH-USD"]
    max_pairs: 50

exchange:
  type: "paper"
  initial_balance_usd: 10000
  maker_fee: 0.006
  taker_fee: 0.012
  slippage_bps: 1.0

data_providers:
  - type: "websocket"
    # Reads from CDP key file (same as v1), falls back to env vars
    key_file: "/app/Config/websocket_api_info.json"
    channels: ["ticker_batch", "heartbeats"]
    idle_timeout: 90.0

strategies:
  - type: "composite_scoring"
    config:
      # Candle aggregation: 5-min bars from 1-min WebSocket candles
      # Warmup: 40 bars × 5 min = ~3.3 hours
      candle_interval_minutes: 5
      # Scoring thresholds
      score_buy_target: 2.0
      score_sell_target: 2.0
      allow_buys_on_red_day: true
      # Bollinger Bands (10 bars = 50 min)
      bb_window: 10
      buy_ratio: 1.05
      # MACD (8/21/5 spans ~105 min of history)
      macd_fast: 8
      macd_slow: 21
      macd_signal: 5
      # RSI (14 bars = 70 min)
      rsi_buy: 25.0
      rsi_sell: 75.0
      # ROC (4 bars × 5 min = ~20 min lookback)
      roc_window: 4
      roc_buy_threshold: 2.0
      roc_sell_threshold: -1.0
      # Volatility & Swing (10 bars = 50 min)
      sma_volatility: 10
      atr_window: 8
      swing_window: 10
      # Guardrails
      min_indicators_required: 3
      cooldown_bars: 2  # 2 × 5min = 10min (v1 uses 7 × 1min = 7min; rounding up)

risk:
  - type: "basic"
    pass_through: false
    hodl_symbols: []  # Set to ["BTC-USD", "ETH-USD", "ATOM-USD"] for live mode
  - type: "exit_manager"
    hard_stop_pct: 0.045          # -4.5% emergency exit
    soft_stop_pct: 0.03           # -3.0% normal stop-loss
    trailing_activation_pct: 0.03 # +3.0% profit activates trailing
    trailing_distance_pct: 0.03   # trail 3% below peak
    check_interval_sec: 5         # throttle ticker checks
  - type: "circuit_breaker"
    max_losses_in_window: 5
    loss_window_minutes: 30
    large_loss_threshold_usd: 50
    max_consecutive_rejections: 10
    cooldown_minutes: 30

execution:
  type: "maker_only"
  max_retries: 3
  post_only: true
  default_notional: 50

storage:
  type: "postgres"
  dsn_env: "DATABASE_URL"

observers:
  - type: "structured_log"
    level: "INFO"
  - type: "signal_comparison"
    log_path: "/app/logs/v2_score_log.jsonl"
  - type: "heartbeat"
    path: "/app/logs/v2/heartbeat"
    interval: 10.0
  - type: "daily_report_v2"
    dsn_env: "DATABASE_URL"
    report_interval_hours: 4
    initial_balance_usd: 10000
    email:
      backend: "smtp"
      sender: "reports@a1zoobies.com"
      recipients: ["dennfish@gmail.com"]
      smtp_host: "email-smtp.us-west-2.amazonaws.com"
      smtp_port: 587
      smtp_user_env: "SMTP_USERNAME"
      smtp_password_env: "SMTP_PASSWORD"
    slack:
      webhook_url_env: "SLACK_WEBHOOK_URL"
    comparison:
      enabled: true
      v1_signal_log: "/app/logs/scores.jsonl"
      v2_signal_log: "/app/logs/v2_score_log.jsonl"
      match_window_seconds: 60
