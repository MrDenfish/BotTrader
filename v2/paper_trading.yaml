# BotTrader v2 — Paper Trading Configuration (Production Docker)
# Usage: python -m v2 --config v2/paper_trading.yaml
#
# Paper trading uses live Coinbase WebSocket data but simulates
# all order fills locally. No real money is used.
#
# Runs alongside v1 on AWS. Shares the same PostgreSQL instance
# (v2 uses v2_* prefixed tables) and logs volume.

app:
  name: "BotTrader"
  mode: "paper"
  symbols: ["BTC-USD", "ETH-USD"]

exchange:
  type: "paper"
  initial_balance_usd: 10000
  maker_fee: 0.006
  taker_fee: 0.012
  slippage_bps: 1.0

data_providers:
  - type: "websocket"
    # Reads from CDP key file (same as v1), falls back to env vars
    key_file: "/app/Config/websocket_api_info.json"
    channels: ["ticker_batch", "heartbeats"]
    idle_timeout: 90.0

strategies:
  - type: "composite_scoring"
    config:
      # Scoring thresholds (lowered for signal pipeline testing)
      score_buy_target: 0.1
      score_sell_target: 0.1
      allow_buys_on_red_day: true
      # Bollinger Bands
      bb_window: 10
      buy_ratio: 1.05
      # MACD
      macd_fast: 8
      macd_slow: 21
      macd_signal: 5
      # RSI (widened for testing — triggers near neutral)
      rsi_buy: 45.0
      rsi_sell: 55.0
      # ROC (widened for testing — triggers on tiny moves)
      roc_window: 20
      roc_buy_threshold: 0.1
      roc_sell_threshold: -0.1
      # Volatility & Swing
      sma_volatility: 10
      atr_window: 8
      swing_window: 10
      # Guardrails (lowered for signal pipeline testing)
      min_indicators_required: 1
      # Warmup (reduced for faster testing — min needed by indicators is 26)
      min_bars: 27

risk:
  type: "basic"
  pass_through: true

execution:
  type: "maker_only"
  max_retries: 3
  post_only: true
  default_notional: 500

storage:
  type: "postgres"
  dsn_env: "DATABASE_URL"

observers:
  - type: "structured_log"
    level: "INFO"
  - type: "signal_comparison"
    log_path: "/app/logs/v2_score_log.jsonl"
  - type: "heartbeat"
    path: "/app/logs/v2/heartbeat"
    interval: 10.0
